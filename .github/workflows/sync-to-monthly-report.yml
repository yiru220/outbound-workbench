name: Sync to monthly-report

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout outbound-workbench
        uses: actions/checkout@v4

      - name: Checkout monthly-report
        uses: actions/checkout@v4
        with:
          repository: yiru220/monthly-report
          token: ${{ secrets.MONTHLY_REPORT_PAT }}
          path: monthly-report
          ref: main

      - name: Sync files
        run: |
          rm -rf monthly-report/outbound-workbench
          mkdir -p monthly-report/outbound-workbench
          rsync -av --exclude .git --exclude .github . monthly-report/outbound-workbench/

      - name: Commit and push
        run: |
          cd monthly-report
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outbound-workbench/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync outbound-workbench from yiru220/outbound-workbench"
            git push
          fi
