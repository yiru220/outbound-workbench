name = "outbound-webhook-proxy"
main = "proxy/worker.js"
compatibility_date = "2024-09-23"

# Workers AI 绑定：Worker 可直接调用 Cloudflare 自带 AI 模型（whisper 转写 + qwen 分析），
# 无需任何 API Key。免费额度 10000 neurons/天 ≈ 240 分钟音频，UTC 00:00 重置。
# 转写后端优先级见 proxy/worker.js：硅基流动(免费) → Workers AI(免费额度) → OpenAI(付费)
[ai]
binding = "AI"

# Cloudflare Worker（Git 部署模式）配置。
# 触发：在 Cloudflare 控制台 Workers & Pages → Create application → Connect to Git
#       选 yiru220/outbound-workbench 仓库 → Build command 留空 → Deploy command
#       默认为 npx wrangler deploy → Deploy。
# 部署后访问地址：https://outbound-webhook-proxy.yiru220.workers.dev