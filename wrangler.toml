name = "outbound-webhook-proxy"
main = "proxy/worker.js"
compatibility_date = "2024-09-23"

# 转写后端优先级见 proxy/worker.js：硅基流动(免费不限量) → Workers AI(免费额度) → OpenAI(付费)
# 当前采用「硅基流动」方案：只需在 Cloudflare 控制台加 Secret SILICONFLOW_API_KEY 即可，
# 无需任何 binding，部署不会因缺少绑定而失败。
#
# ⚠️ 不要在这里写 [ai] binding = "AI"。
#   Cloudflare Git 部署时若 wrangler.toml 声明了 AI 绑定，而 dashboard 上没有对应绑定，
#   构建会直接失败（Latest build failed / No workers bound to this worker）。
#   若日后确实要用 Workers AI 免费额度，必须：
#     dashboard → Worker → Bindings → Add binding → Workers AI → Variable name 填 AI，
#   再在此处加回 [ai] binding = "AI"，两边同时存在才能部署成功。

# Cloudflare Worker（Git 部署模式）配置。
# 触发：在 Cloudflare 控制台 Workers & Pages → Create application → Connect to Git
#       选 yiru220/outbound-workbench 仓库 → Build command 留空 → Deploy command
#       默认为 npx wrangler deploy → Deploy。
# 部署后访问地址：https://outbound-webhook-proxy.yiru220.workers.dev